<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio — PDF to Markdown</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   FOLIO — Minimalist Book Converter
   Inspired by Apple Books & Steve Jobs' love for simplicity
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --bg: #f5f1eb;
  --surface: #ffffff;
  --text: #1a1a1a;
  --text-secondary: #6b6b6b;
  --text-tertiary: #999;
  --accent: #0071e3;
  --accent-dim: #e8f0fe;
  --border: #e5e0d8;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --radius: 10px;
  --radius-sm: 6px;
  --transition: 0.2s ease;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Georgia', serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ─────────────────────────────────────────────────────────────── */

header {
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index: 10;
  flex-shrink: 0;
}

.logo {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.3px;
  display: flex; align-items: center; gap: 8px;
}
.logo span { font-weight: 400; color: var(--text-secondary); font-size: 14px; }

.stats {
  display: flex; gap: 20px; font-size: 13px; color: var(--text-secondary);
  align-items: center;
}
.stats .val { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }

/* ── Upload dropzone ─────────────────────────────────────────────────────── */

.dropzone {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 32px;
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  transition: all var(--transition);
  min-height: 240px;
}
.dropzone:hover, .dropzone.drag {
  border-color: var(--accent);
  background: var(--accent-dim);
}
.dropzone .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
.dropzone h2 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
.dropzone p { font-size: 14px; color: var(--text-secondary); }

.meta-row {
  display: flex; gap: 10px; margin-top: 12px;
}
.meta-row input {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-size: 13px;
  font-family: var(--font);
  background: var(--bg);
  outline: none;
  width: 180px;
}
.meta-row input:focus { border-color: var(--accent); }

/* ── Main workspace (hidden until PDF loaded) ────────────────────────────── */

.workspace {
  flex: 1;
  display: none;
  overflow: hidden;
}
.workspace.active { display: flex; }
.dropzone.hidden { display: none; }

/* ── Progress bar ────────────────────────────────────────────────────────── */

.progress-wrap {
  height: 3px;
  background: var(--border);
  flex-shrink: 0;
}
.progress-bar {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.3s ease;
}
.progress-text {
  font-size: 11px;
  color: var(--text-tertiary);
  text-align: center;
  padding: 4px 0 8px;
  flex-shrink: 0;
}

/* ── Split panes ─────────────────────────────────────────────────────────── */

.panes {
  flex: 1;
  display: flex;
  overflow: hidden;
}

.pane {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.pane-left {
  background: #e8e4dc;
  border-right: 1px solid var(--border);
}

.pane-right {
  background: var(--surface);
}

.pane-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-tertiary);
  margin-bottom: 16px;
  font-weight: 500;
}

/* ── PDF page preview ────────────────────────────────────────────────────── */

.pdf-page {
  background: white;
  box-shadow: var(--shadow);
  border-radius: 2px;
  overflow: hidden;
  max-width: 100%;
  margin-bottom: 16px;
  transition: all var(--transition);
}
.pdf-page img {
  display: block;
  width: 100%;
  height: auto;
}
.pdf-page.active {
  box-shadow: 0 0 0 2px var(--accent), 0 4px 16px rgba(0,113,227,0.15);
}

.page-nav {
  display: flex; gap: 8px; align-items: center; margin-top: 8px;
}
.page-nav button {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 4px 12px;
  cursor: pointer;
  font-size: 13px;
  font-family: var(--font);
  transition: all var(--transition);
}
.page-nav button:hover { background: var(--accent-dim); border-color: var(--accent); }
.page-nav span { font-size: 13px; color: var(--text-secondary); }

/* ── Book content (right pane) ───────────────────────────────────────────── */

.book-pages {
  max-width: 560px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.book-page {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 32px;
  font-family: 'Georgia', 'Times New Roman', serif;
  font-size: 15px;
  line-height: 1.7;
  color: #2c2c2c;
  box-shadow: var(--shadow);
  transition: all 0.3s ease;
  animation: fadeSlideIn 0.4s ease;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.book-page h2 {
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-tertiary);
  margin-bottom: 16px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.book-page p { margin-bottom: 12px; }
.book-page p:last-child { margin-bottom: 0; }

/* Make all cropping images responsive — never overflow the reader column */
.book-page figure {
  margin: 18px 0;
  padding: 0;
  width: 100%;
}
.book-page figure img {
  display: block;
  max-width: 100%;
  height: auto;
  max-height: 55vh;         /* cap so tall images don't exceed viewport */
  width: auto;
  margin: 0 auto;           /* center single images */
  object-fit: contain;
  border-radius: 4px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.12);
}
.book-page figure figcaption {
  font-family: var(--font);
  font-size: 12px;
  color: var(--text-tertiary);
  text-align: center;
  margin-top: 6px;
}

/* Defensive: any inline image in book pages must not overflow */
.book-page img {
  max-width: 100%;
  height: auto;
}

.book-page .loading {
  color: var(--text-tertiary);
  font-style: italic;
  font-family: var(--font);
  font-size: 14px;
}

.book-page .error-text {
  color: #c0392b;
  font-style: italic;
}

/* ── Telemetry panel ─────────────────────────────────────────────────────── */

.telemetry {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--text-secondary);
  box-shadow: var(--shadow);
  z-index: 20;
  min-width: 180px;
}
.telemetry .row {
  display: flex; justify-content: space-between; margin-bottom: 4px;
}
.telemetry .row:last-child { margin-bottom: 0; }
.telemetry .label { color: var(--text-tertiary); }
.telemetry .value { font-weight: 600; color: var(--text); }

/* ── Download button ─────────────────────────────────────────────────────── */

.download-btn {
  display: none;
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 10px 28px;
  font-size: 15px;
  font-family: var(--font);
  font-weight: 500;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(0,113,227,0.3);
  transition: all var(--transition);
  z-index: 20;
  animation: fadeSlideIn 0.4s ease;
}
.download-btn:hover { background: #0077ed; transform: translateX(-50%) scale(1.02); }
.download-btn.show { display: block; }

/* ── Empty state ─────────────────────────────────────────────────────────── */

.empty-state {
  color: var(--text-tertiary);
  font-family: 'Georgia', serif;
  font-size: 16px;
  text-align: center;
  margin-top: 60px;
  font-style: italic;
  line-height: 1.6;
}

/* ── Scrollbar ───────────────────────────────────────────────────────────── */

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #ccc; }

/* ── Responsive ──────────────────────────────────────────────────────────── */

@media (max-width: 768px) {
  .panes { flex-direction: column; }
  .pane-left { border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
}
</style>
</head>
<body>

<!-- ═══════════════════════ HEADER ════════════════════════════════════════ -->

<header>
  <div class="logo">📖 Folio <span>PDF → Markdown</span></div>
  <div class="stats" id="headerStats" style="display:none">
    <span>Page <span class="val" id="statPage">—</span> / <span class="val" id="statTotal">—</span></span>
    <span><span class="val" id="statTime">0s</span> elapsed</span>
    <span><span class="val" id="statRam">—</span> MB</span>
  </div>
</header>

<!-- ═══════════════════ UPLOAD ZONE ════════════════════════════════════════ -->

<div class="dropzone" id="dropzone">
  <div class="icon">📄</div>
  <h2>Drop a PDF here</h2>
  <p>or click to browse — we'll convert it to Markdown in real-time</p>
  <div class="meta-row">
    <input type="text" id="metaTitle" placeholder="Book title (optional)">
    <input type="text" id="metaAuthor" placeholder="Author (optional)">
  </div>
  <input type="file" id="fileInput" accept=".pdf" hidden>
</div>

<!-- ═══════════════════ WORKSPACE ══════════════════════════════════════════ -->

<div class="workspace" id="workspace">
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="progress-text" id="progressText">Ready</div>

  <div class="panes">
    <!-- LEFT: PDF preview -->
    <div class="pane pane-left" id="paneLeft">
      <div class="pane-label">📄 Original PDF</div>
      <div class="pdf-page" id="pdfPreview">
        <img src="" alt="PDF page" id="pdfImage">
      </div>
      <div class="page-nav">
        <button id="btnPrev">← Prev</button>
        <span id="pageIndicator">Page 1</span>
        <button id="btnNext">Next →</button>
      </div>
    </div>

    <!-- RIGHT: Live book content -->
    <div class="pane pane-right" id="paneRight">
      <div class="pane-label">📖 Live Preview</div>
      <div class="book-pages" id="bookPages">
        <div class="empty-state">
          Processing will begin shortly...<br>
          Each page appears here as it's converted.
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════ TELEMETRY ══════════════════════════════════════════ -->

<div class="telemetry" id="telemetry" style="display:none">
  <div class="row"><span class="label">Pages done</span><span class="value" id="telPages">0</span></div>
  <div class="row"><span class="label">OCR time</span><span class="value" id="telOcr">—</span></div>
  <div class="row"><span class="label">Avg / page</span><span class="value" id="telAvg">—</span></div>
  <div class="row"><span class="label">Total</span><span class="value" id="telTotal">—</span></div>
</div>

<!-- ═══════════════════ DOWNLOAD BUTTON ════════════════════════════════════ -->

<button class="download-btn" id="downloadBtn" onclick="downloadMarkdown()">⬇ Download Markdown</button>

<!-- ═══════════════════ SCRIPTS ════════════════════════════════════════════ -->

<script>
// ── State ──
let JOB_ID = null;
let TOTAL_PAGES = 0;
let currentPage = 0;
let pageData = {};  // {pageno: "text"}
let ocrTimes = [];
let startTime = 0;

// ── DOM ──
const dz = document.getElementById('dropzone');
const ws = document.getElementById('workspace');
const fileInput = document.getElementById('fileInput');
const pdfImg = document.getElementById('pdfImage');
const bookPages = document.getElementById('bookPages');
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');
const downloadBtn = document.getElementById('downloadBtn');
const telemetry = document.getElementById('telemetry');
const headerStats = document.getElementById('headerStats');
const emptyState = bookPages.querySelector('.empty-state');

// ── Upload ──
dz.addEventListener('click', () => fileInput.click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('drag');
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) uploadFile(fileInput.files[0]);
});

async function uploadFile(file) {
  if (!file.name.endsWith('.pdf')) return alert('Please select a PDF file.');

  const title = document.getElementById('metaTitle').value || file.name.replace(/\.pdf$/i, '');
  const author = document.getElementById('metaAuthor').value || 'Unknown';

  // Show workspace
  dz.classList.add('hidden');
  ws.classList.add('active');
  progressText.textContent = 'Uploading...';
  headerStats.style.display = 'flex';
  telemetry.style.display = 'block';
  bookPages.innerHTML = '<div class="empty-state">Uploading PDF...</div>';

  // Upload
  const form = new FormData();
  form.append('file', file);
  form.append('title', title);
  form.append('author', author);

  const resp = await fetch('/api/upload', { method: 'POST', body: form });
  const data = await resp.json();
  JOB_ID = data.job_id;
  startTime = Date.now();

  // Get PDF info
  const infoResp = await fetch(`/api/pdf_info/${JOB_ID}`);
  const info = await infoResp.json();
  TOTAL_PAGES = info.pages;
  document.getElementById('statTotal').textContent = TOTAL_PAGES;
  document.getElementById('telPages').textContent = `0 / ${TOTAL_PAGES}`;

  // Show first page
  currentPage = 0;
  loadPdfPage(0);

  // Clear book pages for new content
  bookPages.innerHTML = '';

  // Start SSE stream
  listenStream();
}

// ── SSE Stream ──
function listenStream() {
  const evtSource = new EventSource(`/api/stream/${JOB_ID}`);

  evtSource.addEventListener('progress', e => {
    try { const d = JSON.parse(e.data); progressText.textContent = d.msg; }
    catch(ex) { console.warn('progress parse fail:', ex); }
  });

  evtSource.addEventListener('page_done', e => {
    try { var d = JSON.parse(e.data); } catch(ex) { return; }
    pageData[d.pageno] = d.text;
    ocrTimes.push(d.time_sec);

    // Update progress
    const pct = (d.pageno / d.total) * 100;
    progressBar.style.width = pct + '%';
    progressText.textContent = `Page ${d.pageno} of ${d.total} — ${d.time_sec}s`;
    document.getElementById('statPage').textContent = d.pageno;
    document.getElementById('statTime').textContent = Math.round(d.cumulative_sec) + 's';
    document.getElementById('telPages').textContent = `${d.pageno} / ${d.total}`;
    document.getElementById('telOcr').textContent = d.cumulative_sec.toFixed(0) + 's';
    document.getElementById('telAvg').textContent = (d.cumulative_sec / d.pageno).toFixed(1) + 's';

    // Add book page
    addBookPage(d.pageno, d.text, d.time_sec);

    // Auto-advance PDF preview
    if (currentPage === d.pageno - 1) {
      currentPage = d.pageno;
      if (currentPage < TOTAL_PAGES) loadPdfPage(currentPage);
    }
  });

  evtSource.addEventListener('done', e => {
    try { var d = JSON.parse(e.data); } catch(ex) { console.warn('done parse fail:', ex); return; }
    progressBar.style.width = '100%';
    progressText.textContent = '✅ Complete!';
    downloadBtn.classList.add('show');
    downloadBtn.dataset.jobId = JOB_ID;

    const tel = d.telemetry || {};
    document.getElementById('telTotal').textContent = (tel.total_sec || 0).toFixed(0) + 's';
    document.getElementById('statTime').textContent = Math.round((Date.now() - startTime)/1000) + 's';

    evtSource.close();
  });

  evtSource.addEventListener('error', e => {
    try { var d = JSON.parse(e.data); progressText.textContent = '❌ ' + (d.msg || 'Unknown error'); }
    catch(ex) { progressText.textContent = '❌ Connection issue — retrying...'; }
    evtSource.close();
  });

  evtSource.onerror = () => {
    // If job is already done/error, stop reconnecting
    if (downloadBtn.classList.contains('show')) {
      evtSource.close();
    }
  };
}

// ── Book page rendering (markdown → HTML preview) ──
function mdToHtml(md) {
  if (!md) return '<p><em>(empty page)</em></p>';
  // Escape raw HTML first (content comes from the model — treat as text)
  let h = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Images: ![alt](src)
  h = h.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,
    '<figure><img src="$2" alt="$1" loading="lazy"/><figcaption>$1</figcaption></figure>');
  // Code blocks
  h = h.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
  // Headings
  h = h.replace(/^###### (.*)$/gm, '<h6>$1</h6>');
  h = h.replace(/^##### (.*)$/gm, '<h5>$1</h5>');
  h = h.replace(/^#### (.*)$/gm, '<h4>$1</h4>');
  h = h.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  h = h.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  h = h.replace(/^# (.*)$/gm, '<h1>$1</h1>');
  // Horizontal rule
  h = h.replace(/^---+$/gm, '<hr/>');
  // Blockquotes
  h = h.replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>');
  // Inline code
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold, then italic
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  // List items
  h = h.replace(/^[-*] (.*)$/gm, '<li>$1</li>');
  h = h.replace(/^\d+\. (.*)$/gm, '<li>$1</li>');
  // Wrap paragraphs
  const out = [];
  for (const p of h.split(/\n{2,}/)) {
    const t = p.trim();
    if (!t) continue;
    if (/^<(h[1-6]|hr|pre|figure|blockquote)/.test(t)) out.push(t);
    else if (t.includes('<li>')) out.push('<ul>' + t.replace(/\n/g, '') + '</ul>');
    else out.push(`<p>${t.replace(/\n/g, '<br/>')}</p>`);
  }
  return out.join('');
}

function addBookPage(pageno, text, timeSec) {
  const div = document.createElement('div');
  div.className = 'book-page';
  div.id = `page-${pageno}`;
  div.innerHTML = `<h2>Page ${pageno}</h2>` + mdToHtml(text);
  bookPages.appendChild(div);

  // Scroll to latest
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

// ── PDF preview ──
function loadPdfPage(pageIdx) {
  const url = `/api/preview/${JOB_ID}/${pageIdx}`;
  const img = document.getElementById('pdfImage');
  img.onerror = () => {
    // Retry once after 1s if image fails to load
    setTimeout(() => {
      if (img.src === url || img.src.endsWith(url)) {
        img.src = url + '?retry=' + Date.now();
      }
    }, 1000);
  };
  img.src = url;
  document.getElementById('pageIndicator').textContent = `Page ${pageIdx + 1} of ${TOTAL_PAGES}`;
}

document.getElementById('btnPrev').addEventListener('click', () => {
  if (currentPage > 0) { currentPage--; loadPdfPage(currentPage); }
});
document.getElementById('btnNext').addEventListener('click', () => {
  if (currentPage < TOTAL_PAGES - 1) { currentPage++; loadPdfPage(currentPage); }
});

// ── Download ──
function downloadMarkdown() {
  if (!JOB_ID) return;
  window.open(`/download/${JOB_ID}`, '_blank');
}
</script>

</body>
</html>
