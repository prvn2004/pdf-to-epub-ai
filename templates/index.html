<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio — PDF to Markdown & EPUB Converter</title>

<!-- Modular Stylesheets -->
<link rel="stylesheet" href="/static/css/variables.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/components.css">

<!-- Entry Javascript Module -->
<script type="module" src="/static/js/main.js" defer></script>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">📖 Folio <span>PDF Converter</span></div>
  <div class="header-controls">
    <button class="icon-btn" id="themeToggleBtn" title="Toggle Dark/Light Mode">🌙</button>
  </div>
</header>

<!-- MAIN CONTAINER -->
<main class="app-container">
  
  <!-- CARD 1: UPLOAD ZONE -->
  <div class="card dropzone-card" id="uploadCard">
    <div class="icon">📄</div>
    <h2>Convert PDF to Markdown & EPUB</h2>
    <p>Drop a PDF document here or click to browse</p>
    <div class="meta-row">
      <input type="text" id="metaTitle" placeholder="Book title (optional)">
      <input type="text" id="metaAuthor" placeholder="Author (optional)">
    </div>
    <input type="file" id="fileInput" accept=".pdf" hidden>
  </div>

  <!-- CARD 2: CONVERSION PROGRESS -->
  <div class="card progress-card" id="progressCard" style="display:none">
    <div class="card-header">
      <h3 id="docTitle">Converting Document...</h3>
      <span class="pct-badge" id="pctBadge">0%</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-status" id="progressText">Initializing conversion pipeline...</div>

    <!-- ACTION CONTROLS -->
    <div class="controls-row">
      <button class="btn btn-secondary" id="btnPause" style="display:none">⏸️ Pause</button>
      <button class="btn btn-secondary" id="btnResume" style="display:none">▶️ Resume</button>
      <button class="btn btn-outline" id="btnCancel">❌ Cancel / New PDF</button>
    </div>

    <!-- TELEMETRY STATS -->
    <div class="stats-row" id="telemetryRow">
      <div class="stat-item"><span class="label">Pages</span><span class="val" id="telPages">0 / 0</span></div>
      <div class="stat-item"><span class="label">Avg/Page</span><span class="val" id="telAvg">—</span></div>
      <div class="stat-item"><span class="label">Elapsed</span><span class="val" id="telTime">0s</span></div>
    </div>
  </div>

  <!-- CARD 3: DOWNLOAD SECTION -->
  <div class="card download-card" id="downloadCard" style="display:none">
    <h4>Download Converted Book</h4>
    <div class="format-toggles">
      <button class="fmt-btn active" id="fmtMd">Markdown (.md)</button>
      <button class="fmt-btn" id="fmtEpub">EPUB (.epub)</button>
    </div>
    <button class="btn btn-primary download-action-btn" id="downloadBtn">⬇ Download Markdown (.md)</button>
  </div>

</main>

</body>
</html>
